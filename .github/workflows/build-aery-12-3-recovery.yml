name: Build Aery 12.5 APK Recovery

on:
  push:
    paths:
      - '.github/workflows/build-aery-12-3-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore embedded Android project
        shell: bash
        run: |
          awk 'index($0, "base64 -d > /tmp/aery-project.tgz"){copy=1;next} /^[[:space:]]*AERY_PROJECT[[:space:]]*$/{copy=0} copy{sub(/^[[:space:]]+/, "");print}' .github/workflows/build-apk.yml | base64 -d > /tmp/aery-project.tgz
          tar -xzf /tmp/aery-project.tgz -C .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aery-12.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
